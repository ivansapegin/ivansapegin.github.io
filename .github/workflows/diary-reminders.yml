name: Diary reminders
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  id-token: write
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Get GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken("pbat-diary-reminders")
            core.setOutput("jwt", token)
      - name: Call reminder webhook
        env:
          WEBHOOK_URL: ${{ secrets.NOTION_REMINDER_WEBHOOK }}
          OIDC_JWT: ${{ steps.oidc.outputs.jwt }}
        run: |
          curl -fsS -X POST "$WEBHOOK_URL" \
            -H "Authorization: Bearer $OIDC_JWT" \
            -H "Content-Type: application/json" \
            -d '{}'
