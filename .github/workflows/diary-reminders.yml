name: Diary reminders
on:
  schedule:
    # Run away from the top of the hour, where GitHub cron is busiest.
    # A 30-minute cadence balances timely reminders with Worker credit use.
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: diary-reminders
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get GitHub OIDC token
        id: oidc
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken("pbat-diary-reminders")
            core.setOutput("jwt", token)

      - name: Call reminder webhook with retries
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.NOTION_REMINDER_WEBHOOK }}
          OIDC_JWT: ${{ steps.oidc.outputs.jwt }}
        run: |
          set -uo pipefail

          if [[ -z "${WEBHOOK_URL:-}" ]]; then
            echo "NOTION_REMINDER_WEBHOOK is not configured"
            exit 1
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          for attempt in 1 2 3; do
            : > "$response_file"
            status="$(curl --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --connect-timeout 10 \
              --max-time 30 \
              -X POST "$WEBHOOK_URL" \
              -H "Authorization: Bearer $OIDC_JWT" \
              -H "Content-Type: application/json" \
              -d '{}')" || status="000"

            if [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
              echo "Reminder tick accepted on attempt $attempt (HTTP $status)"
              exit 0
            fi

            echo "Reminder tick attempt $attempt failed (HTTP $status)"
            if [[ -s "$response_file" ]]; then
              head -c 500 "$response_file" | tr '\n' ' '
              echo
            fi

            case "$status" in
              000|404|408|425|429|5??)
                if [[ "$attempt" -lt 3 ]]; then
                  sleep $((attempt * 10))
                  continue
                fi
                ;;
              *)
                echo "Non-retryable HTTP status; stopping"
                exit 1
                ;;
            esac
          done

          echo "Reminder webhook failed after 3 attempts"
          exit 1
