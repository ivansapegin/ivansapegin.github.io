<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Дневник</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --canvas: var(--tg-theme-bg-color, #f4f4f3);
      --surface: var(--tg-theme-secondary-bg-color, #ffffff);
      --raised: #ececea;
      --border: #dededb;
      --text: var(--tg-theme-text-color, #202020);
      --muted: var(--tg-theme-hint-color, #6f6f6b);
      --accent: var(--app-accent, var(--tg-theme-button-color, #111111));
      --accent-contrast: var(--app-accent-contrast, var(--tg-theme-button-text-color, #ffffff));
      --success: #3f956a;
      --safe-bottom: max(18px, env(safe-area-inset-bottom));
    }

    * { box-sizing: border-box; }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      background:
        radial-gradient(
          circle at 94% -8%,
          color-mix(in srgb, var(--accent) 12%, transparent) 0,
          transparent 31%
        ),
        var(--canvas);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      width: min(100%, 430px);
      height: 100dvh;
      margin: 0 auto;
      overflow-y: auto;
      background:
        radial-gradient(
          circle at 94% -8%,
          color-mix(in srgb, var(--accent) 12%, transparent) 0,
          transparent 31%
        ),
        var(--surface);
      padding: 24px 20px calc(20px + var(--safe-bottom));
    }

    .header {
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 30px;
      line-height: 1.08;
      letter-spacing: -0.035em;
    }

    .intro {
      max-width: 370px;
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    .measure-list {
      display: grid;
      gap: 12px;
    }

    .measure {
      --fill: 50%;
      padding: 18px 16px 15px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      transition: border-color 160ms ease;
    }

    .measure.touched {
      border-color: color-mix(in srgb, var(--accent) 42%, var(--border));
    }

    .measure-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: start;
      min-height: 62px;
    }

    .measure-title {
      margin: 0 0 4px;
      font-size: 17px;
      font-weight: 750;
      letter-spacing: -0.012em;
    }

    .measure-question {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }

    .value {
      min-width: 40px;
      margin-top: -2px;
      color: var(--muted);
      font-size: 22px;
      font-weight: 760;
      line-height: 1.2;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .measure.touched .value {
      color: var(--accent);
    }

    input[type="range"] {
      width: 100%;
      height: 36px;
      margin: 8px 0 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: pointer;
      touch-action: pan-y;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 7px;
      border-radius: 7px;
      background:
        linear-gradient(
          to right,
          var(--accent) 0,
          var(--accent) var(--fill),
          var(--raised) var(--fill),
          var(--raised) 100%
        );
    }

    input[type="range"]::-moz-range-track {
      height: 7px;
      border-radius: 7px;
      background: var(--raised);
    }

    input[type="range"]::-moz-range-progress {
      height: 7px;
      border-radius: 7px;
      background: var(--accent);
    }

    input[type="range"]::-webkit-slider-thumb {
      width: 26px;
      height: 26px;
      margin-top: -9.5px;
      appearance: none;
      -webkit-appearance: none;
      border: 3px solid var(--surface);
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.22);
    }

    input[type="range"]::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border: 3px solid var(--surface);
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.22);
    }

    .measure:not(.touched) input[type="range"]::-webkit-slider-runnable-track {
      background: var(--raised);
    }

    .measure:not(.touched) input[type="range"]::-moz-range-progress {
      background: var(--raised);
    }

    .measure:not(.touched) input[type="range"]::-webkit-slider-thumb {
      border: 2px solid var(--border);
      background: var(--surface);
      box-shadow: none;
    }

    .measure:not(.touched) input[type="range"]::-moz-range-thumb {
      border: 2px solid var(--border);
      background: var(--surface);
      box-shadow: none;
    }

    input[type="range"]:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 28%, transparent);
      outline-offset: 2px;
      border-radius: 8px;
    }

    .anchors {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: -2px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.3;
    }

    .anchors span:last-child {
      text-align: right;
    }

    .footer {
      margin-top: 16px;
      padding: 0 0 var(--safe-bottom);
    }

    .send {
      width: 100%;
      min-height: 54px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: var(--accent-contrast);
      font-size: 16px;
      font-weight: 760;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 140ms ease, transform 140ms ease;
    }

    .send:active:not(:disabled) {
      transform: translateY(1px);
    }

    .send:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 28%, transparent);
      outline-offset: 3px;
    }

    .send:disabled {
      cursor: not-allowed;
      background: var(--raised);
      color: var(--muted);
      opacity: 0.82;
    }

    .success {
      min-height: calc(100dvh - 48px - var(--safe-bottom));
      display: grid;
      place-items: center;
      padding-bottom: 34px;
      text-align: center;
    }

    .success[hidden] {
      display: none;
    }

    .success-mark {
      width: 66px;
      height: 66px;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
      border: 1px solid color-mix(in srgb, var(--success) 30%, transparent);
      border-radius: 20px;
      background: color-mix(in srgb, var(--success) 11%, transparent);
      color: var(--success);
      box-shadow: 0 10px 34px color-mix(in srgb, var(--success) 12%, transparent);
      font-size: 34px;
      font-weight: 800;
      line-height: 1;
    }

    .success h2 {
      margin: 0 0 8px;
      font-size: 31px;
      line-height: 1.08;
      letter-spacing: -0.035em;
    }

    .success p {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
    }

    @media (min-width: 720px) {
      body {
        padding: 24px 0;
      }

      .app {
        height: min(820px, calc(100dvh - 48px));
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 10px 28px rgba(0, 0, 0, 0.05);
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --canvas: var(--tg-theme-bg-color, #171717);
        --surface: var(--tg-theme-secondary-bg-color, #202020);
        --raised: #383837;
        --border: #494948;
        --text: var(--tg-theme-text-color, #f7f7f5);
        --muted: var(--tg-theme-hint-color, #aaa9a5);
        --accent: var(--app-accent, var(--tg-theme-button-color, #ffffff));
        --accent-contrast: var(--app-accent-contrast, var(--tg-theme-button-text-color, #111111));
        --success: #72bc8f;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <form id="moment-form">
      <header class="header">
        <h1>Дневник</h1>
        <p class="intro">
          Вспомни последнюю заметную ситуацию, когда захотелось отреагировать сразу.
        </p>
      </header>

      <section class="measure-list" aria-label="Оценка выбранной ситуации">
        <article class="measure" data-measure="command">
          <div class="measure-head">
            <div>
              <p class="measure-title">Сила желания</p>
              <p class="measure-question">Насколько сильным было желание?</p>
            </div>
            <output class="value" id="value-command" for="command">—</output>
          </div>

          <input
            id="command"
            name="command"
            type="range"
            min="0"
            max="10"
            step="0.5"
            value="5"
            aria-label="Сила желания: от почти не тянуло до как приказ"
          />

          <div class="anchors" aria-hidden="true">
            <span>Почти не тянуло</span>
            <span>Как приказ</span>
          </div>
        </article>

        <article class="measure" data-measure="choice">
          <div class="measure-head">
            <div>
              <p class="measure-title">Личный выбор</p>
              <p class="measure-question">Что определило твой следующий шаг?</p>
            </div>
            <output class="value" id="value-choice" for="choice">—</output>
          </div>

          <input
            id="choice"
            name="choice"
            type="range"
            min="0"
            max="10"
            step="0.5"
            value="5"
            aria-label="Источник следующего шага: от надо сейчас до моего выбора"
          />

          <div class="anchors" aria-hidden="true">
            <span>На автомате</span>
            <span>Мой выбор</span>
          </div>
        </article>
      </section>

      <footer class="footer">
        <button class="send" id="send" type="submit" disabled>Отправить</button>
      </footer>
    </form>

    <section class="success" id="success" hidden aria-live="polite">
      <div>
        <div class="success-mark" aria-hidden="true">✓</div>
        <h2>Отметка отправлена</h2>
        <p>Можно возвращаться в Telegram.</p>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const FORM_DEFINITION = {
        schemaVersion: 2,
        id: "psychological-flexibility-daily",
        version: "1",
        focus: {
          id: "psychological-flexibility",
          label: "Психологическая гибкость"
        },
        entryType: "scales",
        timeframe: "last_noticeable_moment",
        metrics: [
          {
            id: "command_strength",
            type: "scale",
            label: "Сила желания",
            prompt: "Насколько сильным было желание?",
            min: 0,
            max: 10,
            step: 0.5,
            construct: "urge_strength",
            direction: "higher_means_stronger_urge",
            anchors: { min: "Почти не тянуло", max: "Как приказ" }
          },
          {
            id: "personal_choice",
            type: "scale",
            label: "Личный выбор",
            prompt: "Что определило твой следующий шаг?",
            min: 0,
            max: 10,
            step: 0.5,
            construct: "values_based_choice",
            direction: "higher_means_more_choice",
            anchors: { min: "На автомате", max: "Мой выбор" }
          }
        ]
      };

      const tg = window.Telegram?.WebApp;
      const params = new URLSearchParams(window.location.search);
      const accentParam = params.get("accent");
      const submitUrl = "https://app.notion.com/webhooks/worker/09565f83-953a-40af-a7e6-84448d2d71db/01a0cab3-b06e-7ca8-9748-7df44db37aa1/hmeSFjx_CM2tPVXx/telegramIncoming";
      const submissionId =
        window.crypto?.randomUUID?.() ??
        `${Date.now()}-${Math.random().toString(36).slice(2)}`;

      tg?.ready();
      tg?.expand();

      function applyAccent(value) {
        if (!value) return;
        const raw = value.startsWith("#") ? value : `#${value}`;
        if (!/^#[0-9a-f]{6}$/i.test(raw)) return;

        const r = parseInt(raw.slice(1, 3), 16);
        const g = parseInt(raw.slice(3, 5), 16);
        const b = parseInt(raw.slice(5, 7), 16);
        const luminance = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;

        document.documentElement.style.setProperty("--app-accent", raw);
        document.documentElement.style.setProperty(
          "--app-accent-contrast",
          luminance > 0.58 ? "#111111" : "#ffffff"
        );
      }

      applyAccent(accentParam);

      const state = {
        command: null,
        choice: null
      };
      const inputByMetric = {
        command_strength: "command",
        personal_choice: "choice"
      };
      const send = document.getElementById("send");
      const form = document.getElementById("moment-form");
      const success = document.getElementById("success");

      function formatValue(value) {
        return Number.isInteger(value) ? String(value) : value.toFixed(1);
      }

      function updateSubmit() {
        send.disabled = state.command === null || state.choice === null;
      }

      function showSuccess() {
        form.hidden = true;
        success.hidden = false;
      }

      function showError() {
        send.disabled = false;
        send.removeAttribute("aria-busy");
        send.textContent = "Повторить";
      }

      document.querySelectorAll('input[type="range"]').forEach((input) => {
        input.addEventListener("input", () => {
          const value = Number(input.value);
          const card = input.closest(".measure");

          state[input.name] = value;
          card.classList.add("touched");
          card.style.setProperty("--fill", `${value * 10}%`);
          document.getElementById(`value-${input.name}`).textContent =
            formatValue(value);
          updateSubmit();
        });
      });

      function buildPayload() {
        const responses = FORM_DEFINITION.metrics.map((metric) => {
          const inputId = inputByMetric[metric.id];
          const value = Number(document.getElementById(inputId).value);
          return {
            id: metric.id,
            type: metric.type,
            label: metric.label,
            prompt: metric.prompt,
            value,
            min: metric.min,
            max: metric.max,
            step: metric.step,
            construct: metric.construct,
            direction: metric.direction,
            anchors: metric.anchors
          };
        });

        return {
          schemaVersion: FORM_DEFINITION.schemaVersion,
          kind: "pbat_checkin",
          form: {
            id: FORM_DEFINITION.id,
            version: FORM_DEFINITION.version,
            focus: FORM_DEFINITION.focus
          },
          entryType: FORM_DEFINITION.entryType,
          timeframe: FORM_DEFINITION.timeframe,
          submittedAt: new Date().toISOString(),
          timeZone:
            Intl.DateTimeFormat().resolvedOptions().timeZone || "Europe/Rome",
          responses
        };
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (send.disabled) return;

        send.disabled = true;
        send.setAttribute("aria-busy", "true");
        send.textContent = "Отправляем…";

        try {
          if (!tg?.initData) {
            throw new Error("Telegram initData is unavailable");
          }

          const payload = buildPayload();
          window.dispatchEvent(
            new CustomEvent("moment-check-submit", { detail: payload })
          );

          const controller = new AbortController();
          const timeout = window.setTimeout(() => controller.abort(), 15000);
          try {
            await fetch(submitUrl, {
              method: "POST",
              mode: "no-cors",
              credentials: "omit",
              cache: "no-store",
              signal: controller.signal,
              headers: {
                "Content-Type": "text/plain;charset=UTF-8"
              },
              body: JSON.stringify({
                source: "mini_app",
                initData: tg.initData,
                submissionId,
                payload
              })
            });
          } finally {
            window.clearTimeout(timeout);
          }

          tg?.HapticFeedback?.notificationOccurred("success");
          showSuccess();
        } catch (error) {
          console.error(error);
          showError();
          tg?.HapticFeedback?.notificationOccurred("error");
          tg?.showAlert?.(
            "Не удалось отправить отметку. Проверь соединение и попробуй ещё раз."
          );
        }
      });

      window.MomentCheck = {
        success: showSuccess,
        error: showError,
        buildPayload
      };

      if (params.get("populate") === "1") {
        const demo = { command: 7.5, choice: 7 };
        Object.entries(demo).forEach(([name, value]) => {
          const input = document.getElementById(name);
          input.value = value;
          input.dispatchEvent(new Event("input", { bubbles: true }));
        });
      }

      if (params.get("submitted") === "1") showSuccess();
    })();
  </script>
</body>
</html>
